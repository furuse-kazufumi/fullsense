<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 790" font-family="Segoe UI, Hiragino Sans, Meiryo, sans-serif">
  <rect width="1240" height="790" fill="#ffffff"/>

  <text x="620" y="46" font-size="30" font-weight="600" fill="#1a2733" text-anchor="middle">同じ 1 回の試行を、2 つの尺度で測る</text>
  <text x="620" y="76" font-size="17" fill="#5b6b7a" text-anchor="middle">転倒の判定が「腰の高さ」ひとつだけだったので、頭から突っ込んでも「生きている」ことになっていた</text>

  <!-- ============ LEFT: what the search optimised ============ -->
  <rect x="36" y="100" width="570" height="590" rx="10" fill="#eef3f9" stroke="#c9d8e8" stroke-width="1.5"/>
  <text x="64" y="140" font-size="21" font-weight="600" fill="#20364d">尺度 A ── 探索が最大化していた量</text>
  <text x="64" y="166" font-size="15" fill="#5b6b7a">生存時間 + 腰の前進 + 足上げ (5cm で頭打ち)</text>

  <!-- fitness formula -->
  <rect x="64" y="186" width="514" height="72" rx="8" fill="#ffffff" stroke="#c9d8e8"/>
  <text x="321" y="215" font-size="14" fill="#5b6b7a" text-anchor="middle">適合度</text>
  <text x="321" y="243" font-size="19" font-weight="600" fill="#1a2733" text-anchor="middle" font-family="Consolas, monospace">surv + 3.0·fwd + 5.0·min(both_lift, 0.05)</text>

  <!-- what each term saw -->
  <rect x="64" y="274" width="514" height="196" rx="8" fill="#ffffff" stroke="#c9d8e8"/>
  <text x="86" y="304" font-size="16" font-weight="600" fill="#20364d">この式が見ていたもの</text>

  <text x="86" y="338" font-size="15" fill="#3c4a58">surv</text>
  <text x="196" y="338" font-size="15" fill="#5b6b7a">腰が 0.55 m を割らなければ生存</text>
  <text x="556" y="338" font-size="16" font-weight="700" fill="#1a2733" text-anchor="end">8.00 秒</text>

  <text x="86" y="376" font-size="15" fill="#3c4a58">fwd</text>
  <text x="196" y="376" font-size="15" fill="#5b6b7a">腰の x 変位</text>
  <text x="556" y="376" font-size="16" font-weight="700" fill="#1a2733" text-anchor="end">+0.46 m</text>

  <text x="86" y="414" font-size="15" fill="#3c4a58">both_lift</text>
  <text x="196" y="414" font-size="15" fill="#5b6b7a">左右の足上げの小さい方</text>
  <text x="556" y="414" font-size="16" font-weight="700" fill="#1a2733" text-anchor="end">左 28.9 / 右 40.0 cm</text>

  <line x1="86" y1="432" x2="556" y2="432" stroke="#dbe5f0"/>
  <text x="86" y="456" font-size="14" fill="#7b8b9a">※ どの項も「左右が交互かどうか」を一度も問わない</text>

  <!-- generation curve -->
  <rect x="64" y="486" width="514" height="118" rx="8" fill="#ffffff" stroke="#c9d8e8"/>
  <text x="86" y="512" font-size="15" fill="#5b6b7a">世代とともにスコアの前進量は伸びた</text>
  <line x1="96" y1="586" x2="546" y2="586" stroke="#b9c7d6"/>
  <polyline points="110,578 210,556 310,532 410,516 520,502" fill="none" stroke="#2c6fb5" stroke-width="3.5"/>
  <circle cx="110" cy="578" r="5" fill="#2c6fb5"/><text x="110" y="570" font-size="13" fill="#2c6fb5" text-anchor="middle">+0.12</text>
  <circle cx="310" cy="532" r="5" fill="#2c6fb5"/><text x="310" y="524" font-size="13" fill="#2c6fb5" text-anchor="middle">+0.35</text>
  <circle cx="520" cy="502" r="6" fill="#2c6fb5"/><text x="520" y="494" font-size="14" font-weight="600" fill="#2c6fb5" text-anchor="middle">+0.68 m</text>

  <rect x="64" y="620" width="514" height="52" rx="8" fill="#dce8f5" stroke="#a9c4e0"/>
  <text x="321" y="652" font-size="19" font-weight="700" fill="#20364d" text-anchor="middle">この式の上では「歩けている」</text>

  <!-- ============ RIGHT: what the feet and head showed ============ -->
  <rect x="634" y="100" width="570" height="590" rx="10" fill="#fdf3e8" stroke="#e8d2b4" stroke-width="1.5"/>
  <text x="662" y="140" font-size="21" font-weight="600" fill="#4d3a20">尺度 B ── 足と頭が示した実体</text>
  <text x="662" y="166" font-size="15" fill="#7a6952">物理エンジンの実接触 + 体幹の傾き + 頭の高さ</text>

  <rect x="662" y="186" width="514" height="284" fill="#ffffff" stroke="#efdcc4"/>

  <!-- timeline of violations -->
  <text x="686" y="216" font-size="16" font-weight="600" fill="#4d3a20">同じ 8 秒間に、何が起きていたか</text>

  <line x1="700" y1="252" x2="1150" y2="252" stroke="#c8b49a" stroke-width="2"/>
  <text x="700" y="274" font-size="13" fill="#8c7a63">0 s</text>
  <text x="1150" y="274" font-size="13" fill="#8c7a63" text-anchor="end">8 s</text>

  <line x1="712" y1="240" x2="712" y2="264" stroke="#c8622f" stroke-width="3"/>
  <text x="716" y="234" font-size="14" font-weight="600" fill="#c8622f">0.21 s</text>
  <text x="716" y="296" font-size="14" fill="#7a6952">体幹が傾き切る (|傾き| 2.85 rad = 163°)</text>

  <line x1="723" y1="240" x2="723" y2="264" stroke="#c8622f" stroke-width="3"/>
  <text x="828" y="330" font-size="14" font-weight="600" fill="#c8622f">0.40 s</text>
  <text x="884" y="330" font-size="14" fill="#7a6952">頭が床の近くまで落ちる (0.243 m)</text>

  <path d="M 730 318 L 826 324" stroke="#c8622f" stroke-width="1.4" fill="none"/>

  <line x1="1150" y1="240" x2="1150" y2="264" stroke="#2c6fb5" stroke-width="3"/>
  <text x="1146" y="234" font-size="14" font-weight="600" fill="#2c6fb5" text-anchor="end">8.00 s</text>
  <text x="1146" y="364" font-size="14" fill="#7a6952" text-anchor="end">腰の高さは最後まで 0.55 m を割らない (最小 0.656 m)</text>
  <path d="M 1148 268 L 1120 356" stroke="#2c6fb5" stroke-width="1.4" fill="none"/>

  <line x1="686" y1="384" x2="1152" y2="384" stroke="#efdcc4"/>

  <text x="686" y="414" font-size="15" fill="#3c4a58">足を基準にした前進</text>
  <text x="1152" y="414" font-size="18" font-weight="700" fill="#4d3a20" text-anchor="end">+0.18 m</text>
  <text x="686" y="444" font-size="15" fill="#3c4a58">頭が腰より前に出た量</text>
  <text x="1152" y="444" font-size="18" font-weight="700" fill="#4d3a20" text-anchor="end">−0.03 → +0.27 m</text>

  <!-- cards -->
  <rect x="662" y="486" width="164" height="118" rx="8" fill="#ffffff" stroke="#e8d2b4"/>
  <text x="744" y="516" font-size="14" fill="#7a6952" text-anchor="middle">立位を保てた時間</text>
  <text x="744" y="556" font-size="27" font-weight="700" fill="#4d3a20" text-anchor="middle">0.21 秒</text>
  <text x="744" y="582" font-size="13" fill="#7a6952" text-anchor="middle">(8 秒中)</text>

  <rect x="837" y="486" width="164" height="118" rx="8" fill="#ffffff" stroke="#e8d2b4"/>
  <text x="919" y="516" font-size="14" fill="#7a6952" text-anchor="middle">両足が宙にある時間</text>
  <text x="919" y="556" font-size="27" font-weight="700" fill="#4d3a20" text-anchor="middle">19 %</text>
  <text x="919" y="582" font-size="13" fill="#7a6952" text-anchor="middle">跳ねている</text>

  <rect x="1012" y="486" width="164" height="118" rx="8" fill="#ffffff" stroke="#e8d2b4"/>
  <text x="1094" y="516" font-size="14" fill="#7a6952" text-anchor="middle">歩行判定</text>
  <text x="1094" y="558" font-size="22" font-weight="700" fill="#4d3a20" text-anchor="middle">歩いていない</text>
  <text x="1094" y="582" font-size="13" fill="#7a6952" text-anchor="middle">DID NOT WALK</text>

  <rect x="662" y="620" width="514" height="52" rx="8" fill="#f7e4cc" stroke="#dcbf98"/>
  <text x="919" y="652" font-size="19" font-weight="700" fill="#4d3a20" text-anchor="middle">頭から突っ込んだまま、腰だけが運ばれていた</text>

  <!-- ============ bottom band ============ -->
  <rect x="36" y="708" width="1168" height="58" rx="8" fill="#1a2733"/>
  <text x="620" y="745" font-size="19" font-weight="600" fill="#ffffff" text-anchor="middle">同じ試行・同じ 8 秒間。測る量を変えただけで、結論が逆になった。</text>
</svg>
