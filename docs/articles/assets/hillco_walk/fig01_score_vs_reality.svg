<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" font-family="Segoe UI, Hiragino Sans, Meiryo, sans-serif">
  <rect width="1240" height="760" fill="#ffffff"/>

  <!-- title -->
  <text x="620" y="46" font-size="30" font-weight="600" fill="#1a2733" text-anchor="middle">同じ 1 回の試行を、2 つの尺度で測る</text>
  <text x="620" y="76" font-size="17" fill="#5b6b7a" text-anchor="middle">筋骨格ヒトの「進化探索が見つけた歩行」— スコアは前進、実体は後方転倒</text>

  <!-- ============ LEFT PANEL: what the score saw ============ -->
  <rect x="36" y="100" width="570" height="560" rx="10" fill="#eef3f9" stroke="#c9d8e8" stroke-width="1.5"/>
  <text x="64" y="140" font-size="21" font-weight="600" fill="#20364d">尺度 A ── 探索が最大化していた量</text>
  <text x="64" y="166" font-size="15" fill="#5b6b7a">重心 (COM) の水平前進量 + 生存時間</text>

  <!-- score plot -->
  <rect x="64" y="186" width="514" height="230" fill="#ffffff" stroke="#dbe5f0"/>
  <line x1="104" y1="386" x2="556" y2="386" stroke="#b9c7d6" stroke-width="1.5"/>
  <line x1="104" y1="206" x2="104" y2="386" stroke="#b9c7d6" stroke-width="1.5"/>
  <text x="96" y="391" font-size="13" fill="#7b8b9a" text-anchor="end">0</text>
  <text x="96" y="301" font-size="13" fill="#7b8b9a" text-anchor="end">0.35</text>
  <text x="96" y="211" font-size="13" fill="#7b8b9a" text-anchor="end">0.70</text>
  <text x="70" y="196" font-size="13" fill="#7b8b9a">前進 (m)</text>
  <text x="330" y="410" font-size="13" fill="#7b8b9a" text-anchor="middle">探索の世代 →</text>
  <polyline points="104,382 148,371 192,352 236,340 280,318 324,301 368,281 412,262 456,243 500,228 544,213"
            fill="none" stroke="#2c6fb5" stroke-width="3.5" stroke-linejoin="round"/>
  <circle cx="544" cy="213" r="6.5" fill="#2c6fb5"/>
  <text x="536" y="200" font-size="15" font-weight="600" fill="#2c6fb5" text-anchor="end">0.68 m</text>

  <!-- score cards -->
  <rect x="64" y="436" width="248" height="92" rx="8" fill="#ffffff" stroke="#c9d8e8"/>
  <text x="188" y="470" font-size="15" fill="#5b6b7a" text-anchor="middle">スコア上の前進</text>
  <text x="188" y="508" font-size="32" font-weight="700" fill="#1a2733" text-anchor="middle">+0.68 m</text>
  <rect x="330" y="436" width="248" height="92" rx="8" fill="#ffffff" stroke="#c9d8e8"/>
  <text x="454" y="470" font-size="15" fill="#5b6b7a" text-anchor="middle">スコア上の生存</text>
  <text x="454" y="508" font-size="32" font-weight="700" fill="#1a2733" text-anchor="middle">7〜8 秒</text>

  <rect x="64" y="548" width="514" height="86" rx="8" fill="#dce8f5" stroke="#a9c4e0"/>
  <text x="321" y="582" font-size="18" font-weight="600" fill="#20364d" text-anchor="middle">この 2 つだけを見ると</text>
  <text x="321" y="612" font-size="20" font-weight="700" fill="#20364d" text-anchor="middle">「歩けている」と判定してしまう</text>

  <!-- ============ RIGHT PANEL: what the feet showed ============ -->
  <rect x="634" y="100" width="570" height="560" rx="10" fill="#fdf3e8" stroke="#e8d2b4" stroke-width="1.5"/>
  <text x="662" y="140" font-size="21" font-weight="600" fill="#4d3a20">尺度 B ── 足の軌跡が示した実体</text>
  <text x="662" y="166" font-size="15" fill="#7a6952">物理エンジンの実接触点 + 腰の高さ</text>

  <rect x="662" y="186" width="514" height="230" fill="#ffffff" stroke="#efdcc4"/>

  <!-- ground -->
  <line x1="678" y1="386" x2="1160" y2="386" stroke="#8c7a63" stroke-width="2.5"/>
  <!-- fall line 0.55m -->
  <line x1="678" y1="318" x2="1160" y2="318" stroke="#c08a3e" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="1156" y="313" font-size="13" fill="#a9762f" text-anchor="end">転倒ライン 0.55 m</text>
  <!-- standing hip line 0.94m -->
  <line x1="678" y1="236" x2="1160" y2="236" stroke="#b9c7d6" stroke-width="1.2" stroke-dasharray="4 5"/>
  <text x="1156" y="231" font-size="13" fill="#8b98a6" text-anchor="end">立位の腰 0.94 m</text>

  <!-- pose t=0 : upright, both feet planted -->
  <g stroke="#3c4a58" stroke-width="3.2" fill="none" stroke-linecap="round" opacity="0.45">
    <circle cx="760" cy="204" r="14" fill="#3c4a58" stroke="none"/>
    <line x1="760" y1="218" x2="760" y2="236"/>
    <line x1="760" y1="236" x2="748" y2="312"/>
    <line x1="748" y1="312" x2="752" y2="386"/>
    <line x1="760" y1="236" x2="772" y2="312"/>
    <line x1="772" y1="312" x2="768" y2="386"/>
  </g>
  <circle cx="760" cy="236" r="6" fill="#2c6fb5" opacity="0.45"/>
  <text x="760" y="406" font-size="14" fill="#7a6952" text-anchor="middle">t = 0 s</text>

  <!-- pose t=0.5 : airborne, both feet off the ground -->
  <g stroke="#3c4a58" stroke-width="3.2" fill="none" stroke-linecap="round" opacity="0.72">
    <circle cx="912" cy="196" r="14" fill="#3c4a58" stroke="none"/>
    <line x1="912" y1="210" x2="906" y2="228"/>
    <line x1="906" y1="228" x2="884" y2="296"/>
    <line x1="884" y1="296" x2="880" y2="358"/>
    <line x1="906" y1="228" x2="922" y2="300"/>
    <line x1="922" y1="300" x2="918" y2="362"/>
  </g>
  <circle cx="906" cy="228" r="6" fill="#2c6fb5" opacity="0.72"/>
  <!-- gap markers showing feet are off the floor -->
  <line x1="880" y1="362" x2="880" y2="384" stroke="#c8622f" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="918" y1="366" x2="918" y2="384" stroke="#c8622f" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="899" y="406" font-size="14" fill="#7a6952" text-anchor="middle">t = 0.5 s</text>
  <text x="899" y="424" font-size="13" font-weight="600" fill="#c8622f" text-anchor="middle">両足が床から離れている</text>

  <!-- pose t=1.15 : collapsed backwards, hip at fall line -->
  <g stroke="#3c4a58" stroke-width="3.2" fill="none" stroke-linecap="round">
    <circle cx="1030" cy="292" r="14" fill="#3c4a58" stroke="none"/>
    <line x1="1030" y1="300" x2="1064" y2="318"/>
    <line x1="1064" y1="318" x2="1094" y2="352"/>
    <line x1="1094" y1="352" x2="1086" y2="386"/>
    <line x1="1064" y1="318" x2="1096" y2="330"/>
    <line x1="1096" y1="330" x2="1112" y2="386"/>
  </g>
  <circle cx="1064" cy="318" r="6.5" fill="#2c6fb5"/>
  <text x="1068" y="406" font-size="14" fill="#7a6952" text-anchor="middle">t = 1.15 s</text>
  <text x="1068" y="424" font-size="13" font-weight="600" fill="#c8622f" text-anchor="middle">後方へ転倒</text>

  <!-- hip descent arrow -->
  <path d="M 700 240 L 700 314" stroke="#c8622f" stroke-width="2.4" fill="none"/>
  <path d="M 694 306 L 700 316 L 706 306 Z" fill="#c8622f"/>
  <text x="712" y="284" font-size="14" fill="#c8622f">腰が沈む</text>

  <!-- reality cards -->
  <rect x="662" y="436" width="164" height="92" rx="8" fill="#ffffff" stroke="#e8d2b4"/>
  <text x="744" y="468" font-size="14" fill="#7a6952" text-anchor="middle">転倒までの時間</text>
  <text x="744" y="506" font-size="28" font-weight="700" fill="#4d3a20" text-anchor="middle">1.15 秒</text>
  <rect x="837" y="436" width="164" height="92" rx="8" fill="#ffffff" stroke="#e8d2b4"/>
  <text x="919" y="468" font-size="14" fill="#7a6952" text-anchor="middle">実際の到達位置</text>
  <text x="919" y="506" font-size="28" font-weight="700" fill="#4d3a20" text-anchor="middle">23 cm 後方</text>
  <rect x="1012" y="436" width="164" height="92" rx="8" fill="#ffffff" stroke="#e8d2b4"/>
  <text x="1094" y="468" font-size="14" fill="#7a6952" text-anchor="middle">両足が宙にある時間</text>
  <text x="1094" y="506" font-size="28" font-weight="700" fill="#4d3a20" text-anchor="middle">69 %</text>

  <rect x="662" y="548" width="514" height="86" rx="8" fill="#f7e4cc" stroke="#dcbf98"/>
  <text x="919" y="582" font-size="18" font-weight="600" fill="#4d3a20" text-anchor="middle">足を見ると</text>
  <text x="919" y="612" font-size="20" font-weight="700" fill="#4d3a20" text-anchor="middle">踏んでいない。跳ね上がって倒れているだけ</text>

  <!-- ============ bottom band ============ -->
  <rect x="36" y="678" width="1168" height="58" rx="8" fill="#1a2733"/>
  <text x="620" y="715" font-size="19" font-weight="600" fill="#ffffff" text-anchor="middle">同じ試行・同じ時刻。尺度を変えただけで、結論が逆になった。</text>
</svg>
